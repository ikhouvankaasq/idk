<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDJ-3000 PRO DJ SYSTEM</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #16181e;
            --deck-bg: #1c1f26;
            --accent-green: #00ff66;
            --accent-blue: #00ccff;
            --accent-red: #ff3366;
            --accent-orange: #ff9900;
            --text-main: #e0e6ed;
            --text-muted: #788496;
            --border-color: #2a2e39;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent-blue);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .dj-setup {
            display: grid;
            grid-template-columns: 1fr 300px 1fr;
            gap: 15px;
            width: 100%;
            max-width: 1300px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* DECKS */
        .deck {
            background: var(--deck-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .deck-title {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .deck-a .deck-title { color: var(--accent-green); }
        .deck-b .deck-title { color: var(--accent-blue); }

        .track-select {
            background: #111317;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 100%;
        }

        /* CDJ-3000 WAVEFORM DISPLAY */
        .screen {
            background: #050608;
            border: 2px solid #222630;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .screen-info {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent-orange);
        }

        .waveform-container {
            position: relative;
            height: 90px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        canvas.waveform-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .playhead-line {
            position: absolute;
            left: 30%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent-red);
            z-index: 10;
            box-shadow: 0 0 5px var(--accent-red);
        }

        /* DECK CONTROLS */
        .deck-controls {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 15px;
            align-items: center;
        }

        .transport-btns {
            display: flex;
            gap: 10px;
        }

        .btn-cdj {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: #252933;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 8px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
        }

        .btn-cdj:active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }

        .btn-play {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .btn-play.playing {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 12px var(--accent-green);
        }

        .btn-cue {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        .pitch-tempo {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-blue);
        }

        .loop-section {
            display: flex;
            gap: 6px;
        }

        .btn-loop {
            flex: 1;
            background: #222630;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-loop.active {
            background: var(--accent-orange);
            color: #000;
            font-weight: bold;
        }

        /* MIXER */
        .mixer {
            background: #121419;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .mixer-title {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .eq-channels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .eq-channel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #181b22;
            padding: 10px;
            border-radius: 6px;
        }

        .knob-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 100%;
        }

        .knob-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        /* Custom Knob Styling */
        .rotary-knob {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, #3a3f4d 0%, #1a1c23 70%);
            border: 2px solid #2d323e;
            position: relative;
            cursor: ns-resize;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        .rotary-knob::after {
            content: '';
            position: absolute;
            top: 4px;
            left: calc(50% - 1.5px);
            width: 3px;
            height: 10px;
            background: var(--accent-blue);
            border-radius: 2px;
            transform-origin: 1.5px 17px;
            transform: rotate(0deg);
        }

        .deck-a-eq .rotary-knob::after { background: var(--accent-green); }
        .deck-b-eq .rotary-knob::after { background: var(--accent-blue); }

        .fx-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #181b22;
            padding: 10px;
            border-radius: 6px;
        }

        .fx-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .btn-fx {
            background: #252933;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 4px;
            font-size: 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .btn-fx:active, .btn-fx.active {
            background: var(--accent-red);
            color: white;
        }

        .crossfader-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: auto;
            background: #181b22;
            padding: 10px;
            border-radius: 6px;
        }

        .file-upload-btn {
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: underline;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>🎧 CDJ-3000 PRO MULTI-PLAYER SETUP</h1>

    <div class="dj-setup">

        <!-- DECK A -->
        <div class="deck deck-a">
            <div class="deck-header">
                <span class="deck-title">DECK 1</span>
                <label class="file-upload-btn">
                    📁 Laad eigen MP3
                    <input type="file" id="file-a" accept="audio/*" onchange="loadCustomFile(event, 'a')">
                </label>
            </div>

            <select class="track-select" id="select-a" onchange="changeTrack('a', this.value)">
                <option value="https://ikhouvankaasq.github.io/Memory_Leak.mp3">Track 1: Memory Leak (AI Glitch Hop)</option>
                <option value="synth1">Track 2: Synth Techno Beat</option>
                <option value="synth2">Track 3: Cyberpunk Bassline</option>
            </select>

            <!-- WAVEFORM SCREEN -->
            <div class="screen">
                <div class="screen-info">
                    <span id="bpm-a">BPM: 128.0</span>
                    <span id="time-a">00:00.00</span>
                </div>
                <div class="waveform-container">
                    <div class="playhead-line"></div>
                    <canvas id="waveform-a" class="waveform-canvas"></canvas>
                </div>
            </div>

            <!-- LOOP CONTROLS -->
            <div class="loop-section">
                <button class="btn-loop" onclick="toggleLoop('a', 1)">1 Beat</button>
                <button class="btn-loop" onclick="toggleLoop('a', 4)">4 Beats</button>
                <button class="btn-loop" onclick="toggleLoop('a', 8)">8 Beats</button>
                <button class="btn-loop" id="loop-btn-a" onclick="toggleLoop('a', 'custom')">LOOP OFF</button>
            </div>

            <!-- DECK CONTROLS -->
            <div class="deck-controls">
                <div class="transport-btns">
                    <button class="btn-cdj btn-cue" onclick="cueTrack('a')">CUE</button>
                    <button class="btn-cdj btn-play" id="play-btn-a" onclick="togglePlay('a')">▶</button>
                </div>
                <div class="pitch-tempo">
                    <div class="slider-container">
                        <span>TEMPO</span>
                        <input type="range" id="pitch-a" min="0.8" max="1.2" step="0.005" value="1" oninput="updatePitch('a', this.value)">
                    </div>
                    <button class="btn-loop" onclick="syncTempo('a')" style="background: var(--accent-blue); color: #000; font-weight: bold;">SYNC TEMPO</button>
                </div>
            </div>
        </div>

        <!-- MIXER (CENTRAL CONTROL & EQ) -->
        <div class="mixer">
            <div class="mixer-title">DJM-900 PRO MIXER</div>

            <!-- EQ KNOBS SECTION -->
            <div class="eq-channels">
                <!-- DECK A EQ -->
                <div class="eq-channel deck-a-eq">
                    <span style="font-size: 0.75rem; color: var(--accent-green); font-weight: bold;">CH 1</span>
                    <div class="knob-group">
                        <span class="knob-label">HI</span>
                        <div class="rotary-knob" data-deck="a" data-eq="high" data-value="0"></div>
                    </div>
                    <div class="knob-group">
                        <span class="knob-label">MID</span>
                        <div class="rotary-knob" data-deck="a" data-eq="mid" data-value="0"></div>
                    </div>
                    <div class="knob-group">
                        <span class="knob-label">LOW</span>
                        <div class="rotary-knob" data-deck="a" data-eq="low" data-value="0"></div>
                    </div>
                    <div class="slider-container" style="flex-direction: column; margin-top: 5px;">
                        <span class="knob-label">TRIM</span>
                        <input type="range" min="0" max="1.5" step="0.01" value="1" oninput="updateVolume('a', this.value)">
                    </div>
                </div>

                <!-- DECK B EQ -->
                <div class="eq-channel deck-b-eq">
                    <span style="font-size: 0.75rem; color: var(--accent-blue); font-weight: bold;">CH 2</span>
                    <div class="knob-group">
                        <span class="knob-label">HI</span>
                        <div class="rotary-knob" data-deck="b" data-eq="high" data-value="0"></div>
                    </div>
                    <div class="knob-group">
                        <span class="knob-label">MID</span>
                        <div class="rotary-knob" data-deck="b" data-eq="mid" data-value="0"></div>
                    </div>
                    <div class="knob-group">
                        <span class="knob-label">LOW</span>
                        <div class="rotary-knob" data-deck="b" data-eq="low" data-value="0"></div>
                    </div>
                    <div class="slider-container" style="flex-direction: column; margin-top: 5px;">
                        <span class="knob-label">TRIM</span>
                        <input type="range" min="0" max="1.5" step="0.01" value="1" oninput="updateVolume('b', this.value)">
                    </div>
                </div>
            </div>

            <!-- DJ SOUND FX PADS -->
            <div class="fx-section">
                <span class="knob-label" style="text-align: center;">BEAT FX PADS</span>
                <div class="fx-grid">
                    <button class="btn-fx" onmousedown="triggerFX('stutter')" onmouseup="stopFX('stutter')">GATE</button>
                    <button class="btn-fx" onmousedown="triggerFX('laser')">LASER</button>
                    <button class="btn-fx" onmousedown="triggerFX('echo')">ECHO</button>
                </div>
            </div>

            <!-- CROSSFADER -->
            <div class="crossfader-container">
                <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted);">
                    <span>CH 1</span>
                    <span>CROSSFADER</span>
                    <span>CH 2</span>
                </div>
                <input type="range" id="crossfader" min="0" max="1" step="0.01" value="0.5" oninput="updateCrossfader(this.value)">
            </div>
        </div>

        <!-- DECK B -->
        <div class="deck deck-b">
            <div class="deck-header">
                <span class="deck-title">DECK 2</span>
                <label class="file-upload-btn">
                    📁 Laad eigen MP3
                    <input type="file" id="file-b" accept="audio/*" onchange="loadCustomFile(event, 'b')">
                </label>
            </div>

            <select class="track-select" id="select-b" onchange="changeTrack('b', this.value)">
                <option value="synth2">Track 1: Cyberpunk Bassline</option>
                <option value="https://ikhouvankaasq.github.io/Memory_Leak.mp3">Track 2: Memory Leak (AI Glitch Hop)</option>
                <option value="synth1">Track 3: Synth Techno Beat</option>
            </select>

            <!-- WAVEFORM SCREEN -->
            <div class="screen">
                <div class="screen-info">
                    <span id="bpm-b">BPM: 124.0</span>
                    <span id="time-b">00:00.00</span>
                </div>
                <div class="waveform-container">
                    <div class="playhead-line"></div>
                    <canvas id="waveform-b" class="waveform-canvas"></canvas>
                </div>
            </div>

            <!-- LOOP CONTROLS -->
            <div class="loop-section">
                <button class="btn-loop" onclick="toggleLoop('b', 1)">1 Beat</button>
                <button class="btn-loop" onclick="toggleLoop('b', 4)">4 Beats</button>
                <button class="btn-loop" onclick="toggleLoop('b', 8)">8 Beats</button>
                <button class="btn-loop" id="loop-btn-b" onclick="toggleLoop('b', 'custom')">LOOP OFF</button>
            </div>

            <!-- DECK CONTROLS -->
            <div class="deck-controls">
                <div class="transport-btns">
                    <button class="btn-cdj btn-cue" onclick="cueTrack('b')">CUE</button>
                    <button class="btn-cdj btn-play" id="play-btn-b" onclick="togglePlay('b')">▶</button>
                </div>
                <div class="pitch-tempo">
                    <div class="slider-container">
                        <span>TEMPO</span>
                        <input type="range" id="pitch-b" min="0.8" max="1.2" step="0.005" value="1" oninput="updatePitch('b', this.value)">
                    </div>
                    <button class="btn-loop" onclick="syncTempo('b')" style="background: var(--accent-blue); color: #000; font-weight: bold;">SYNC TEMPO</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // WEB AUDIO API ENGINE
        let audioCtx;

        class Deck {
            constructor(id) {
                this.id = id;
                this.audio = new Audio();
                this.audio.crossOrigin = "anonymous";
                this.isPlaying = false;
                this.baseBpm = 128;
                this.currentPitch = 1.0;
                this.loopActive = false;
                this.loopBeats = 4;
                this.audioBuffer = null;
                this.peaks = [];
                
                // Audio Nodes
                this.sourceNode = null;
                this.gainNode = null;
                this.eqHigh = null;
                this.eqMid = null;
                this.eqLow = null;
                this.crossfadeGain = null;
                
                this.canvas = document.getElementById(`waveform-${id}`);
                this.ctx = this.canvas.getContext('2d');
            }

            initAudioNode() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                if (this.sourceNode) return;

                this.sourceNode = audioCtx.createMediaElementSource(this.audio);
                this.gainNode = audioCtx.createGain();
                this.crossfadeGain = audioCtx.createGain();

                // 3-Band Equalizer Filters
                this.eqLow = audioCtx.createBiquadFilter();
                this.eqLow.type = 'lowshelf';
                this.eqLow.frequency.value = 320;

                this.eqMid = audioCtx.createBiquadFilter();
                this.eqMid.type = 'peaking';
                this.eqMid.frequency.value = 1000;
                this.eqMid.Q.value = 0.5;

                this.eqHigh = audioCtx.createBiquadFilter();
                this.eqHigh.type = 'highshelf';
                this.eqHigh.frequency.value = 3200;

                // Connect Chain: Source -> EQ Low -> EQ Mid -> EQ High -> Trim Gain -> Crossfade Gain -> Destination
                this.sourceNode.connect(this.eqLow);
                this.eqLow.connect(this.eqMid);
                this.eqMid.connect(this.eqHigh);
                this.eqHigh.connect(this.gainNode);
                this.gainNode.connect(this.crossfadeGain);
                this.crossfadeGain.connect(audioCtx.destination);
            }
        }

        const decks = {
            a: new Deck('a'),
            b: new Deck('b')
        };

        // Synthesize fallback audio for demo tracks
        function createSynthAudio(type) {
            const canvas = document.createElement('canvas');
            const offlineCtx = new OfflineAudioContext(2, 44100 * 30, 44100);
            
            const osc = offlineCtx.createOscillator();
            const gain = offlineCtx.createGain();
            
            if (type === 'synth1') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, 0);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(90, 0);
            }

            osc.connect(gain);
            gain.connect(offlineCtx.destination);
            osc.start();
            osc.stop(30);

            return offlineCtx.startRendering().then(buffer => {
                const wav = audioBufferToWav(buffer);
                const blob = new Blob([wav], { type: 'audio/wav' });
                return URL.createObjectURL(blob);
            });
        }

        // Initialize Audio & Canvas setup
        window.addEventListener('load', () => {
            setupKnobs();
            resizeCanvases();
            
            // Load initial tracks
            changeTrack('a', document.getElementById('select-a').value);
            changeTrack('b', document.getElementById('select-b').value);
            
            updateCrossfader(0.5);
            requestAnimationFrame(drawWaveforms);
        });

        function resizeCanvases() {
            Object.values(decks).forEach(deck => {
                deck.canvas.width = deck.canvas.parentElement.clientWidth;
                deck.canvas.height = deck.canvas.parentElement.clientHeight;
            });
        }

        // LOAD AND PRE-RENDER WAVEFORM
        async function changeTrack(deckId, url) {
            const deck = decks[deckId];
            if (deck.isPlaying) togglePlay(deckId);

            if (url.startsWith('synth')) {
                url = await createSynthAudio(url);
            }

            deck.audio.src = url;
            deck.audio.load();

            // Fetch & Decode for Pre-rendered CDJ Waveform
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                deck.audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                generateWaveformPeaks(deck);
            } catch (e) {
                console.log("Waveform pre-render loaded via fallback/audio stream.");
                generateDummyPeaks(deck);
            }
        }

        function generateWaveformPeaks(deck) {
            const rawData = deck.audioBuffer.getChannelData(0);
            const samples = 400; // Resolution
            const blockSize = Math.floor(rawData.length / samples);
            deck.peaks = [];
            for (let i = 0; i < samples; i++) {
                let sum = 0;
                for (let j = 0; j < blockSize; j += 10) {
                    sum += Math.abs(rawData[i * blockSize + j]);
                }
                deck.peaks.push(sum / (blockSize / 10));
            }
        }

        function generateDummyPeaks(deck) {
            deck.peaks = [];
            for (let i = 0; i < 400; i++) {
                deck.peaks.push(Math.sin(i * 0.1) * 0.4 + Math.random() * 0.5);
            }
        }

        function loadCustomFile(event, deckId) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                changeTrack(deckId, url);
            }
        }

        // CDJ PLAY / PAUSE / CUE
        function togglePlay(deckId) {
            const deck = decks[deckId];
            deck.initAudioNode();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const btn = document.getElementById(`play-btn-${deckId}`);

            if (deck.isPlaying) {
                deck.audio.pause();
                deck.isPlaying = false;
                btn.classList.remove('playing');
            } else {
                deck.audio.play();
                deck.isPlaying = true;
                btn.classList.add('playing');
            }
        }

        function cueTrack(deckId) {
            const deck = decks[deckId];
            deck.audio.currentTime = 0;
            if (deck.isPlaying) {
                deck.audio.pause();
                deck.isPlaying = false;
                document.getElementById(`play-btn-${deckId}`).classList.remove('playing');
            }
        }

        function updatePitch(deckId, val) {
            const deck = decks[deckId];
            deck.currentPitch = parseFloat(val);
            deck.audio.playbackRate = deck.currentPitch;
            document.getElementById(`bpm-${deckId}`).innerText = `BPM: ${(deck.baseBpm * deck.currentPitch).toFixed(1)}`;
        }

        function syncTempo(deckId) {
            const targetDeck = deckId === 'a' ? decks.b : decks.a;
            const currentDeck = decks[deckId];
            currentDeck.currentPitch = targetDeck.currentPitch;
            document.getElementById(`pitch-${deckId}`).value = targetDeck.currentPitch;
            updatePitch(deckId, targetDeck.currentPitch);
        }

        function toggleLoop(deckId, beats) {
            const deck = decks[deckId];
            if (beats === 'custom') {
                deck.loopActive = !deck.loopActive;
            } else {
                deck.loopActive = true;
                deck.loopBeats = beats;
            }

            const btn = document.getElementById(`loop-btn-${deckId}`);
            if (deck.loopActive) {
                btn.classList.add('active');
                btn.innerText = `LOOP ON (${deck.loopBeats}B)`;
            } else {
                btn.classList.remove('active');
                btn.innerText = `LOOP OFF`;
            }
        }

        function updateVolume(deckId, val) {
            const deck = decks[deckId];
            if (deck.gainNode) {
                deck.gainNode.gain.value = parseFloat(val);
            }
        }

        function updateCrossfader(val) {
            const x = parseFloat(val);
            // Constant power crossfade curve
            decks.a.initAudioNode();
            decks.b.initAudioNode();
            decks.a.crossfadeGain.gain.value = Math.cos(x * 0.5 * Math.PI);
            decks.b.crossfadeGain.gain.value = Math.sin(x * 0.5 * Math.PI);
        }

        // ROTARY KNOB CONTROLS (MIXER EQ)
        function setupKnobs() {
            document.querySelectorAll('.rotary-knob').forEach(knob => {
                let startY, startVal;

                knob.addEventListener('mousedown', e => {
                    startY = e.clientY;
                    startVal = parseFloat(knob.dataset.value) || 0;

                    const onMouseMove = e => {
                        const delta = startY - e.clientY;
                        let newVal = Math.min(12, Math.max(-24, startVal + delta * 0.3));
                        knob.dataset.value = newVal;

                        // Rotate indicator (-135deg to +135deg)
                        const deg = (newVal / 24) * 135;
                        knob.style.transform = `rotate(${deg}deg)`;

                        // Apply EQ to Web Audio Node
                        const deckId = knob.dataset.deck;
                        const eqType = knob.dataset.eq;
                        const deck = decks[deckId];
                        deck.initAudioNode();

                        if (eqType === 'high') deck.eqHigh.gain.value = newVal;
                        if (eqType === 'mid') deck.eqMid.gain.value = newVal;
                        if (eqType === 'low') deck.eqLow.gain.value = newVal;
                    };

                    const onMouseUp = () => {
                        window.removeEventListener('mousemove', onMouseMove);
                        window.removeEventListener('mouseup', onMouseUp);
                    };

                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                });
            });
        }

        // DRAW CDJ-3000 STYLE SCROLLING WAVEFORM
        function drawWaveforms() {
            Object.values(decks).forEach(deck => {
                const ctx = deck.ctx;
                const width = deck.canvas.width;
                const height = deck.canvas.height;

                ctx.clearRect(0, 0, width, height);

                // Draw background grid
                ctx.strokeStyle = '#11151c';
                ctx.lineWidth = 1;
                for (let x = 0; x < width; x += 20) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }

                if (deck.audio.duration) {
                    const currentTime = deck.audio.currentTime;
                    const duration = deck.audio.duration;
                    const playheadX = width * 0.3; // 30% position

                    // Format Time display
                    const mins = Math.floor(currentTime / 60);
                    const secs = Math.floor(currentTime % 60);
                    const ms = Math.floor((currentTime % 1) * 100);
                    document.getElementById(`time-${deck.id}`).innerText = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;

                    // Handle Loop logic
                    if (deck.loopActive) {
                        const loopDuration = (60 / (deck.baseBpm * deck.currentPitch)) * deck.loopBeats;
                        if (!deck.loopStart) deck.loopStart = currentTime;
                        if (currentTime >= deck.loopStart + loopDuration) {
                            deck.audio.currentTime = deck.loopStart;
                        }
                    } else {
                        deck.loopStart = null;
                    }

                    // Render scrolling waveform bars (CDJ-3000 style)
                    if (deck.peaks.length > 0) {
                        const totalPeaks = deck.peaks.length;
                        const progress = currentTime / duration;
                        const currentPeakIndex = progress * totalPeaks;
                        const barWidth = 3;
                        const spacing = 1;

                        for (let i = 0; i < totalPeaks; i++) {
                            // Calculate X relative to playhead line
                            const x = playheadX + (i - currentPeakIndex) * (barWidth + spacing);

                            if (x > -10 && x < width + 10) {
                                const peakHeight = deck.peaks[i] * (height * 0.8);
                                const isPast = x < playheadX;

                                ctx.fillStyle = isPast ? '#0066aa' : (deck.id === 'a' ? '#00ff66' : '#00ccff');
                                ctx.fillRect(x, (height - peakHeight) / 2, barWidth, peakHeight);
                            }
                        }
                    }
                }
            });

            requestAnimationFrame(drawWaveforms);
        }

        // DJ FX PADS GENERATOR
        function triggerFX(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'echo') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        // Helper function for WAV Audio Buffer Encoding
        function audioBufferToWav(buffer) {
            let numOfChan = buffer.numberOfChannels,
                length = buffer.length * numOfChan * 2 + 44,
                out = new DataView(new ArrayBuffer(length)),
                channels = [], i, sample,
                offset = 0,
                pos = 0;

            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

            for(i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

            while(offset < buffer.length) {
                for(i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                    out.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return out.buffer;
        }
    </script>
